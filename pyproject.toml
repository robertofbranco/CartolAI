[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartolai"
version = "0.1.0"
description = "Cartola FC data collection, feature engineering, backtesting, and team building tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "pulp>=2.7.0",
    "tqdm>=4.65.0",
    "pyarrow>=12.0.0",
    "matplotlib==3.10.9",
    "python-dotenv",
]

[project.scripts]
cartola-backtest = "cartola_backtest:main"
cartola-plot-backtest-report = "plot_backtest_report:main"
cartola-collect-all = "collect_all_data:main"
cartola-collector = "cartola_collector:main"
cartola-import-historic = "import_historic_data:main"
cartola-team-builder = "cartola_team_builder:main"

[tool.setuptools]
packages = ["cartola_data"]
py-modules = [
    "cartola_backtest",
    "cartola_collector",
    "cartola_model_training",
    "cartola_team_builder",
    "collect_all_data",
    "feature_engineering",
    "import_historic_data",
    "plot_backtest_report",
]
